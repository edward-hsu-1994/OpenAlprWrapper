name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity minimal

    - name: Test
      run: dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --verbosity minimal

    - name: Pack NuGet package
      run: dotnet pack --configuration ${{ env.BUILD_CONFIGURATION }} --output ./artifacts/packages

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/packages/*.nupkg
        retention-days: 30

    - name: Upload symbol package
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: symbols
        path: artifacts/packages/*.snupkg
        retention-days: 30
        if-no-files-found: ignore

    - name: Run sample application
      run: dotnet run --project samples/OpenAlprWrapper.Sample.csproj --verbosity minimal || echo "Sample may fail without native runtime, which is expected"
