name: NuGet Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate version tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$tag' must be vMAJOR.MINOR.PATCH with an optional SemVer prerelease/build suffix." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore src/OpenAlprWrapper/OpenAlprWrapper.csproj

      - name: Pack NuGet package
        run: dotnet pack src/OpenAlprWrapper/OpenAlprWrapper.csproj --configuration Release --no-restore --output "${{ runner.temp }}/packages" -p:Version='${{ steps.version.outputs.value }}'

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenAlprWrapper-${{ steps.version.outputs.value }}
          path: ${{ runner.temp }}/packages/*.nupkg
          if-no-files-found: error
          retention-days: 30
