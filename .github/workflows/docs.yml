name: Docs Site

on:
  push:
    branches: [ docs ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy dist/ to orphan docs-dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan docs-dist-next
          git rm -rf . >/dev/null 2>&1 || true
          # git-rm only clears tracked files; drop untracked build inputs too
          rm -rf node_modules src .github package.json package-lock.json vite.config.js index.html .gitignore
          cp -r dist/. .
          rm -rf dist
          touch .nojekyll
          git add -A
          git commit -m "docs: build from ${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push -f origin docs-dist-next:docs-dist
